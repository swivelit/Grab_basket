<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Partners</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto; margin: 24px; }
    table { width:100%; border-collapse: collapse; }
    th, td { border-bottom:1px solid #eee; padding:10px; text-align:left; }
    a { color:#d35400; text-decoration:none; }
  </style>
</head>
<body>
  <h1>Partners</h1>
  <a href="/admin">← Back</a>
  <table>
    <thead>
      <tr><th>ID</th><th>Email</th><th>Available</th></tr>
    </thead>
    <tbody>
      {% for p in partners %}
        <tr>
          <td>{{ p.id }}</td>
          <td>{{ p.email }}</td>
          <td>{{ p.is_partner_available }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
